<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad)"/>

  <!-- Logo/Icon -->
  <text x="100" y="180" font-size="120" fill="white" font-family="system-ui, -apple-system, sans-serif">⚡</text>

  <!-- Title -->
  <text x="100" y="280" font-size="72" font-weight="800" fill="white" font-family="system-ui, -apple-system, sans-serif">fonstr</text>

  <!-- Subtitle -->
  <text x="100" y="350" font-size="36" fill="rgba(255,255,255,0.95)" font-family="system-ui, -apple-system, sans-serif">Run Your Own Nostr Relay</text>
  <text x="100" y="400" font-size="36" fill="rgba(255,255,255,0.95)" font-family="system-ui, -apple-system, sans-serif">in One Line</text>

  <!-- Code block background -->
  <rect x="100" y="440" width="520" height="80" rx="12" fill="rgba(255,255,255,0.2)"/>

  <!-- Code -->
  <text x="130" y="495" font-size="42" font-weight="600" fill="white" font-family="Monaco, Menlo, monospace">npx fonstr</text>

  <!-- Features -->
  <text x="100" y="560" font-size="24" fill="rgba(255,255,255,0.9)" font-family="system-ui, -apple-system, sans-serif">✓ Zero Config   ✓ Pure JavaScript   ✓ Works Everywhere</text>

  <!-- URL -->
  <text x="1000" y="600" font-size="20" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">fonstr.com</text>
</svg>
